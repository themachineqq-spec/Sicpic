name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sicpic
          POSTGRES_PASSWORD: sicpic
          POSTGRES_DB: sicpic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sicpic -d sicpic_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:db
        env:
          DATABASE_URL: postgres://sicpic:sicpic@localhost:5432/sicpic_test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: browser-actions/setup-chrome@v1
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:4173
      - name: Playwright smoke
        run: |
          npm run start -- -p 4173 &
          server=$!
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:4173/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:4173/
          CHROME_PATH="$(command -v google-chrome)" npm run test:e2e
          kill "$server"
        env:
          SICPIC_URL: http://127.0.0.1:4173
          SICPIC_E2E_AUTH: "1"
          SICPIC_E2E_LOCAL: "1"
          SICPIC_E2E_TOKEN: e2e-token
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:4173
